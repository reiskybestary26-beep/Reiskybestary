<head>

<meta charset="UTF-8">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

<style>

:root {
  --ink: #0d1117;
  --ink-soft: #374151;
  --ink-muted: #9ca3af;
  --accent: #b45309;
  --accent-light: #fef3c7;
  --paper: #faf9f6;
  --white: #ffffff;
  --rule: #e5e0d8;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {
  background: var(--paper);
  font-family: 'DM Sans', sans-serif;
  color: var(--ink);
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 0;
  opacity: 0.4;
}

/* ── NAVBAR ── */
.navbar {
  padding: 20px 0;
  background: rgba(250,249,246,0.92);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--rule);
  position: sticky;
  top: 0;
  z-index: 100;
}

.navbar-brand {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 700;
  font-size: 26px;
  color: var(--ink);
  letter-spacing: -0.5px;
  text-decoration: none;
}

.navbar-brand span {
  display: inline-block;
  width: 8px; height: 8px;
  background: var(--accent);
  border-radius: 50%;
  margin-left: 3px;
  vertical-align: middle;
  margin-bottom: 4px;
}

.nav-link {
  margin-left: 28px;
  font-size: 13px;
  font-weight: 500;
  color: var(--ink-soft);
  letter-spacing: 0.3px;
  transition: color 0.2s;
  position: relative;
}

.nav-link::after {
  content: '';
  position: absolute;
  bottom: -2px; left: 0;
  width: 0; height: 1.5px;
  background: var(--accent);
  transition: width 0.25s;
}

.nav-link:hover, .nav-link.active { color: var(--ink); }
.nav-link:hover::after, .nav-link.active::after { width: 100%; }

/* ── HERO ── */
.hero {
  padding: 90px 0 70px;
  text-align: center;
  position: relative;
}

.hero-eyebrow {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}

.hero-eyebrow::before,
.hero-eyebrow::after {
  content: '';
  display: inline-block;
  width: 32px; height: 1px;
  background: var(--accent);
}

.hero h1 {
  font-family: 'Cormorant Garamond', serif;
  font-size: 68px;
  font-weight: 700;
  line-height: 1.05;
  color: var(--ink);
  letter-spacing: -1px;
  margin-bottom: 16px;
}

.hero h1 em {
  font-style: italic;
  color: var(--accent);
}

.hero p {
  font-size: 16px;
  color: var(--ink-muted);
  font-weight: 300;
  max-width: 420px;
  margin: 0 auto;
  line-height: 1.75;
}

.hero-divider {
  text-align: center;
  margin: 48px 0 56px;
  color: var(--ink-muted);
  font-size: 20px;
  letter-spacing: 12px;
}

/* ── ARTICLE LIST HEADER ── */
.list-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--rule);
  padding-bottom: 20px;
  margin-bottom: 40px;
}

.list-count {
  font-family: 'Cormorant Garamond', serif;
  font-size: 15px;
  color: var(--ink-muted);
  font-style: italic;
}

/* ── CARD ── */
.card {
  border: none;
  border-radius: 0;
  background: transparent;
  height: 100%;
  box-shadow: none;
}

.card-inner {
  background: var(--white);
  border: 1px solid var(--rule);
  border-radius: 4px;
  overflow: hidden;
  height: 100%;
  display: flex;
  flex-direction: column;
  transition: box-shadow 0.3s, transform 0.3s;
}

.card-inner:hover {
  box-shadow: 0 20px 50px rgba(13,17,23,0.1);
  transform: translateY(-6px);
}

.card-img-wrap {
  overflow: hidden;
  position: relative;
}

.card img {
  height: 220px;
  object-fit: cover;
  width: 100%;
  filter: grayscale(10%);
  transition: filter 0.4s, transform 0.4s;
  display: block;
}

.card-inner:hover img {
  filter: grayscale(0%);
  transform: scale(1.03);
}

.category {
  position: absolute;
  top: 14px; left: 14px;
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--accent);
  background: var(--white);
  padding: 4px 10px;
  border-radius: 2px;
}

.card-body {
  padding: 28px;
  flex: 1;
  display: flex;
  flex-direction: column;
}

.card-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 26px;
  font-weight: 700;
  line-height: 1.25;
  margin-bottom: 14px;
  color: var(--ink);
  letter-spacing: -0.3px;
}

.card-text {
  color: var(--ink-muted);
  line-height: 1.75;
  margin-bottom: 24px;
  font-size: 14px;
  font-weight: 300;
  flex: 1;
}

.read-btn {
  width: 100%;
  padding: 13px;
  border: 1px solid var(--ink);
  border-radius: 3px;
  background: transparent;
  color: var(--ink);
  font-family: 'DM Sans', sans-serif;
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 1px;
  text-transform: uppercase;
  transition: background 0.2s, color 0.2s;
  cursor: pointer;
}

.read-btn:hover {
  background: var(--ink);
  color: var(--white);
}

/* ── FOOTER ── */
footer {
  margin-top: 90px;
  padding: 40px 0;
  background: var(--ink);
  color: #6b7280;
  text-align: center;
  font-size: 13px;
  font-weight: 300;
  letter-spacing: 0.3px;
}

footer span { color: var(--accent); }

/* ── ANIMATIONS ── */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(24px); }
  to   { opacity: 1; transform: translateY(0); }
}

.hero-eyebrow { animation: fadeUp 0.5s ease both; animation-delay: 0.1s; }
.hero h1      { animation: fadeUp 0.5s ease both; animation-delay: 0.2s; }
.hero p       { animation: fadeUp 0.5s ease both; animation-delay: 0.3s; }

/* ── RESPONSIVE ── */
@media (max-width: 576px) {
  .hero h1 { font-size: 44px; }
  .list-header { flex-direction: column; align-items: flex-start; gap: 6px; }
}

</style>
</head>

  </div>
</section>

<!-- ARTICLE LIST -->
<div class="container pb-5">

  <div class="hero-divider">— ✦ —</div>

    <p class="list-count" id="articleCount">Memuat artikel...</p>
  </div>

</div>
